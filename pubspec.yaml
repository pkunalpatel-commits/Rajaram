name: dhan_option_oi_chart
description: Open-source Option Premium OI Profile Chart with live DhanHQ data, multi-TF VWAP, previous/weekly/monthly levels.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  csv: ^6.0.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.69.0          # Pure Flutter candlestick + custom overlays
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
