name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean and regenerate Android platform
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name dhan_option_oi_chart

      - name: Ensure INTERNET permission + network security
        run: |
          # INTERNET is usually added by flutter create; force it
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<manifest |<manifest |\n    <uses-permission android:name="android.permission.INTERNET"/>\n|' "$MANIFEST" || true
          fi
          # Allow cleartext just in case intermediate redirects
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true
          fi
          cat android/app/src/main/AndroidManifest.xml | head -25

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhan-option-oi-chart-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
